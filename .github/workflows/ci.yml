name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets deploy.yml gate on CI via `uses: ./.github/workflows/ci.yml`. Without
  # this a reusable call is invalid and GitHub rejects the *calling* workflow
  # outright — which is why every Deploy run since at least 2026-07-12 failed
  # with zero jobs.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Lint is type-aware; without the generated client, all Prisma types
      # resolve to `error` and trip the no-unsafe-* rules across the API.
      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Lint API
        working-directory: apps/api
        run: npm run lint

      - name: Lint Dashboard
        working-directory: apps/dashboard
        run: npm run lint

      - name: Lint Checkout
        working-directory: apps/checkout
        run: npm run lint

      - name: Lint WWW
        working-directory: apps/www
        run: npm run lint

      - name: Prettier check (API)
        working-directory: apps/api
        run: npx prettier --check "src/**/*.ts"

  # ── Test API ─────────────────────────────────────────────────────────────────
  test-api:
    name: Test API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: useroutr
          POSTGRES_PASSWORD: useroutr
          POSTGRES_DB: useroutr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U useroutr"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://useroutr:useroutr@localhost:5432/useroutr_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Run tests
        working-directory: apps/api
        run: npm test

      # The e2e suite boots the whole AppModule against the Postgres and Redis
      # services above, so it catches wiring the unit tests cannot — a module
      # that fails to resolve, a migration that does not apply, a route that
      # moved. It was previously not run anywhere, which is how a suite broken
      # on main went unnoticed until someone ran it by hand.
      #
      # It stays in this job rather than a new one so it reuses the services
      # and the install that are already paid for here.
      - name: Run e2e tests
        working-directory: apps/api
        run: npm run test:e2e

  # ── Test Frontend ────────────────────────────────────────────────────────────
  # Neither app's vitest suite ran anywhere until now, which is how a broken
  # `@useroutr/ui` alias, a suite with no runner at all, and assertions still
  # pinned to the pre-`/v1`-fix request paths all survived on main. Both apps
  # share one job: they need no services, and the `npm ci` dominates the cost.
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Test Dashboard
        working-directory: apps/dashboard
        run: npm test

      - name: Test Checkout
        working-directory: apps/checkout
        run: npm test

  # ── Test Soroban Contracts ───────────────────────────────────────────────────
  test-contracts-soroban:
    name: Test Soroban Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned toolchain: a newer stable rustc rejects `ethnum 1.5.2`
      # (transitive via soroban-sdk) with E0512 on an invalid transmute.
      # 1.93.0 builds the workspace clean; bump deliberately alongside deps.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown

      # Cache only the immutable registry/git downloads. Caching `target/`
      # across dependency or toolchain changes restores stale compiled
      # artifacts, which surfaces as spurious trait-resolution errors
      # (e.g. ChaCha20Rng: CryptoRng) on incremental recompile.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('contract/soroban/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Run tests
        working-directory: contract/soroban
        # --locked pins the committed Cargo.lock resolution. Without it, a
        # fresh resolve pulls newly-published majors (e.g. ed25519-dalek 3.0)
        # that break soroban-env-host's testutils.
        run: cargo test --workspace --locked

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Build Dashboard
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: https://api.useroutr.com
        run: npm run build

      - name: Build Checkout
        working-directory: apps/checkout
        env:
          NEXT_PUBLIC_API_URL: https://api.useroutr.com
        run: npm run build

      - name: Build WWW
        working-directory: apps/www
        run: npm run build
