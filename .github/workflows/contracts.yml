name: Deploy Contracts

on:
  workflow_dispatch:
    inputs:
      contract_type:
        description: "Contract type to deploy"
        required: true
        type: choice
        options:
          - evm
          - soroban
      network:
        description: "Target network"
        required: true
        type: choice
        options:
          - testnet
          - mainnet
      evm_chain:
        description: "EVM chain (only for EVM deploys)"
        required: false
        type: choice
        options:
          - sepolia
          - base-sepolia
          - bsc-testnet
          - polygon-amoy
          - arbitrum-sepolia
          - avalanche-fuji
          - base
          - ethereum
          - polygon
          - arbitrum
          - avalanche

jobs:
  # ── Deploy EVM Contracts ─────────────────────────────────────────────────────
  deploy-evm:
    name: Deploy EVM – ${{ inputs.evm_chain }}
    runs-on: ubuntu-latest
    if: inputs.contract_type == 'evm'
    environment: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Compile contracts
        working-directory: contract/evm
        run: npx hardhat compile

      - name: Run tests before deploy
        working-directory: contract/evm
        run: npx hardhat test

      - name: Deploy HTLC
        working-directory: contract/evm
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: npx hardhat run scripts/deploy.ts --network ${{ inputs.evm_chain }}

      - name: Verify on explorer
        if: inputs.network == 'mainnet' || inputs.network == 'testnet'
        working-directory: contract/evm
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: npx hardhat verify --network ${{ inputs.evm_chain }} || true

  # ── Deploy Soroban Contracts ─────────────────────────────────────────────────
  deploy-soroban:
    name: Deploy Soroban – ${{ inputs.network }}
    runs-on: ubuntu-latest
    if: inputs.contract_type == 'soroban'
    environment: contracts
    steps:
      - uses: actions/checkout@v4

      # Same pin as ci.yml's test job: a newer stable rejects `ethnum 1.5.2`
      # (transitive via soroban-sdk) with E0512, and deploy.sh runs the tests.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown, wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/soroban/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contract/soroban/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      # deploy.sh builds, deploys, records ids and initializes. Keeping CI on
      # the same script as local deploys is the point — an inline loop here
      # drifts from what operators actually run.
      - name: Deploy to Stellar
        working-directory: contract/soroban
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
          STELLAR_SOROBAN_RPC_URL: ${{ secrets.STELLAR_SOROBAN_RPC_URL }}
          FEE_COLLECTOR_ADMIN: ${{ secrets.FEE_COLLECTOR_ADMIN }}
          FEE_COLLECTOR_TREASURY: ${{ secrets.FEE_COLLECTOR_TREASURY }}
        run: ./scripts/deploy.sh ${{ inputs.network }} --yes

      - name: Verify deployment
        working-directory: contract/soroban
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
          STELLAR_SOROBAN_RPC_URL: ${{ secrets.STELLAR_SOROBAN_RPC_URL }}
        run: ./scripts/verify.sh ${{ inputs.network }}

      # The ids live in the runner's .env, which is discarded — surface them so
      # they can be copied into the deployment record and the API's config.
      - name: Report contract ids
        if: always()
        working-directory: contract/soroban
        run: |
          record="deployments/${{ inputs.network }}.json"
          if [ ! -f "$record" ]; then
            echo "No deployment record — deploy did not reach the record step." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Deployed contract ids"
            echo '```json'
            cat "$record"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
